<!DOCTYPE html>
<html>
<head>
    <meta name="lava-verify" content="6c3eab7281e790de"> 
    <title>Goal VPN</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-blue: #0088cc;
            --primary-glow: rgba(0, 136, 204, 0.4);
            --hover-blue: #00a2f3;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Beautiful glowing background radial blobs */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
        }

        /* Glassmorphism Card styling */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        /* Logo icon styling with VPN shield motif */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-shield {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0088cc 0%, #7c3aed 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.3);
            position: relative;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-shield svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #ffffff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Premium Blue Button */
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 28px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #006699 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px var(--primary-glow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .btn-telegram:hover {
            background: linear-gradient(135deg, var(--hover-blue) 0%, var(--primary-blue) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.5);
        }

        .btn-telegram:active {
            transform: translateY(1px);
        }

        .btn-telegram svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Security/Features badge list */
        .features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feature-item svg {
            width: 14px;
            height: 14px;
            fill: var(--primary-blue);
        }

        /* Keyframe animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(0, 136, 204, 0.3);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 15px 35px rgba(0, 136, 204, 0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <div class="logo-shield">
                    <!-- Shield with keyhole / VPN symbol -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,5A3,3 0 0,1 15,8C15,9.37 14.07,10.53 12.8,10.87L13.8,16H10.2L11.2,10.87C9.93,10.53 9,9.37 9,8A3,3 0 0,1 12,5Z"/>
                    </svg>
                </div>
            </div>
            
            <h1>Goal VPN - Telegram Bot</h1>
            <p class="description">Если вы попали на эту страницу, то скорее всего это произошло случайно. Нажмите на кнопку ниже</p>
            
            <a href="https://t.me/g0alvpn_bot" class="btn-telegram" target="_blank" rel="noopener noreferrer">
                <!-- Telegram SVG Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M9.78,18.65L10.06,14.42L17.74,7.5C18.08,7.19 17.67,7.02 17.21,7.32L7.73,13.29L3.62,12C2.73,11.72 2.72,11.1 3.81,10.68L19.86,4.5C20.61,4.22 21.27,4.67 21.04,5.77L18.32,18.62C18.12,19.58 17.55,19.8 16.75,19.35L12.6,16.3L10.6,18.23C10.38,18.45 10.19,18.65 9.78,18.65Z"/>
                </svg>
                @g0alvpn_bot
            </a>
        </div>
    </div>
</body>
</html>
